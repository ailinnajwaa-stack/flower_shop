name: flower_shop
description: "Ailin Flower Shop: a simple Flutter menu app for browsing fresh flowers and prices."
publish_to: 'none' # Private app, prevents accidental publishing to pub.dev

# Format: major.minor.patch+buildNumber
version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # Everything inside assets/images/ is bundled (rose.jpg, tulip.jpg, sunflower.jpg)
  assets:
    - assets/images/

  # Custom font used by the AppBar title ('Pacifico').
  # Place the file at assets/fonts/Pacifico-Regular.ttf
  fonts:
    - family: Pacifico
      fonts:
        - asset: assets/fonts/Pacifico-Regular.ttf