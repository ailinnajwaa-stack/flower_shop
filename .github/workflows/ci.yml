name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.8
          channel: stable
      - run: flutter --version
      - run: dart format --output=none --set-exit-if-changed .
      - run: flutter analyze